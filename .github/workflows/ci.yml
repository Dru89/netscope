name: CI

on:
  push:
    branches: [main, nightly]
    # Also run on release tags: release.yml's own gate is just `npm test`, so
    # without this the exact commit being shipped never gets tsc, clippy,
    # cargo test, or E2E.
    tags: ["v*"]
  pull_request:
    branches: [main, nightly]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A lockfile that isn't what npm would produce means something wrote it
      # with a different npm. That shape installs fine for whoever wrote it and
      # then fails every job on the next PR, naming packages unrelated to the
      # change. Catch it on the PR that causes it.
      - name: Lockfile matches what npm resolves
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json

      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Vite output must exist for tauri's context generation
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # The recent-files, window and menu modules have sizeable #[cfg(windows)] and
  # #[cfg(target_os = "macos")] branches that the Linux job above never
  # compiles, so a break there used to surface only when a release build ran.
  # Check (not test — the one unit test is platform-independent) on both.
  rust-cross:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vite output must exist for tauri's context generation
      - run: npm run build:vite
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  # Drives the real release binary through tauri-driver (WebDriver over
  # WebKitWebDriver). Linux-only: tauri-driver has no macOS support, and the
  # Windows setup (msedgedriver) is future work.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Build app binary
        run: npx tauri build --no-bundle
      - name: Run E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
