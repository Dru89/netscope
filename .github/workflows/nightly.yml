name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 2am UTC daily
  workflow_dispatch: # manual trigger for testing
  push:
    branches: [nightly] # trigger on pushes during active development

# Cancel superseded nightly builds — a newer push makes the in-flight one stale.
concurrency:
  group: nightly
  cancel-in-progress: true

# Two-channel scheme: nightly artifacts live on dated pre-releases
# (v4.0.0-nightly.20260711), but the updater needs a stable URL, so the
# publish job copies the dated release's latest.json onto a rolling
# "nightly" release. Nightly builds are pointed at that manifest via the
# --config endpoint override below; stable builds never see it.

jobs:
  # Compute the nightly version string once so all jobs agree, even if
  # the workflow straddles midnight UTC.
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.version.outputs.nightly_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          DATE=$(date -u +%Y%m%d)
          echo "nightly_version=${BASE}-nightly.${DATE}" >> $GITHUB_OUTPUT
          echo "tag_name=v${BASE}-nightly.${DATE}" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [compute-version, test]
    permissions:
      contents: write
    strategy:
      # Keep going if one platform fails — partial nightly artifacts are still useful.
      fail-fast: false
      # One platform at a time: each build merge-replaces the shared
      # latest.json asset on the release (download/delete/upload), and
      # concurrent jobs race on the delete. Serial is slower but safe.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            platform: win
            args: ""
          - os: ubuntu-latest
            platform: linux
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libarchive-tools zstd

      - run: npm ci

      # Stamp the version without committing — tauri.conf.json reads its
      # version from package.json, so this versions the whole build.
      - name: Set nightly version
        shell: bash
        run: npm version ${{ needs.compute-version.outputs.nightly_version }} --no-git-tag-version

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Prefer the secret named after the variable; fall back to the
          # Electron-era name until those are deleted. See #34.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.MAC_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.compute-version.outputs.tag_name }}
          releaseName: "Nightly — ${{ needs.compute-version.outputs.nightly_version }}"
          releaseBody: |
            Automated nightly build — ${{ needs.compute-version.outputs.nightly_version }}

            This is a pre-release build intended for testing. It may be unstable.
            Stable users on the main release channel will not receive this update automatically.
          prerelease: true
          # Nightly builds check the rolling nightly manifest for updates
          args: >-
            ${{ matrix.args }}
            --config {"plugins":{"updater":{"endpoints":["https://github.com/Dru89/netscope/releases/download/nightly/latest.json"]}}}

      - name: Build and upload pacman package
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.compute-version.outputs.nightly_version }}"
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          scripts/build-pacman.sh "$DEB" "$VERSION" dist-pacman
          gh release upload "${{ needs.compute-version.outputs.tag_name }}" dist-pacman/*.pkg.tar.zst --clobber

  # Copy the dated release's updater manifest onto the rolling "nightly"
  # release so running nightly builds (which point at that fixed URL) see it.
  publish-manifest:
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Update rolling nightly manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir manifest
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease \
              --title "Nightly channel" \
              --notes "Rolling updater manifest for the nightly channel. Artifacts live on the dated nightly releases."
          gh release upload nightly manifest/latest.json --clobber
