name: Release

on:
  push:
    tags:
      - "v*"

# Ensure only one release runs at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run tests once before building on all platforms
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Build and upload per platform. tauri-action creates the GitHub Release
  # from the tag on first upload, and each platform merges its entries into
  # the shared latest.json updater manifest on the release. The stable
  # updater endpoint (releases/latest/download/latest.json) then serves it.
  #
  # Updater artifact signing needs TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
  # macOS code signing + notarization read the APPLE_* env vars; if they are
  # missing the build still succeeds but ships unsigned (same behavior as
  # the old Electron pipeline).
  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: mac
            # One universal binary covers arm64 + x64
            args: --target universal-apple-darwin
          - os: windows-latest
            platform: win
            args: ""
          - os: ubuntu-latest
            platform: linux
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libarchive-tools zstd

      - run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Verify the macOS build was actually signed
      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          echo "Checking signature on $APP"
          codesign --verify --deep --strict "$APP" 2>&1
          echo "Signature verified OK"
          codesign -dvvv "$APP" 2>&1 | grep "Authority"

      # Arch can't run the AppImage out of the box (no FUSE 2), so wrap the
      # deb tree into a real pacman package and add it to the release.
      - name: Build and upload pacman package
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          scripts/build-pacman.sh "$DEB" "$VERSION" dist-pacman
          gh release upload "$GITHUB_REF_NAME" dist-pacman/*.pkg.tar.zst --clobber
