[package]
name = "netscope"
version = "4.0.0"
description = "A desktop app for viewing and exploring HAR files"
authors = ["Drew Hays"]
license = "MIT"
repository = "https://github.com/Dru89/netscope"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "netscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools: ship the View > Toggle Developer Tools item in release builds,
# matching the Electron app (uses private APIs on macOS; fine outside MAS).
tauri = { version = "2.11.1", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"

# The mock runtime (tauri::test) lets window-scoped commands be driven
# natively on any platform, with no webview. Dev-only: resolver v2 keeps the
# "test" feature out of normal builds.
[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }

# OS recent-documents integration (Electron's app.addRecentDocument parity).
# Versions match what tauri/tao/wry already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSDocumentController",
  "NSWindow",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
