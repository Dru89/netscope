[package]
name = "netscope"
version = "4.0.0"
description = "A desktop app for viewing and exploring HAR files"
authors = ["Drew Hays"]
license = "MIT"
repository = "https://github.com/Dru89/netscope"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "netscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
